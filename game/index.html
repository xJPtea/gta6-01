<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Bay Heist</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c1220; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }

</head>

<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="help">Coral Bay Heist — WASD move/drive &middot; E steal or exit a car &middot; Click/Space shoot &middot; Q save &middot; ESC pause</div>
</div>
